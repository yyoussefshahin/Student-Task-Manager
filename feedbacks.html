<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin - Feedbacks</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #fff; }
        .navbar { background: #141414; border-bottom: 1px solid #222; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar-brand { color: #fbbf24; font-weight: 800; text-decoration: none; }
        .main { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .fb-card { background: #141414; border: 1px solid #222; border-radius: 14px; padding: 20px; margin-bottom: 14px; }
        .reply-box { background: #1a2e1a; border: 1px solid #22c55e44; border-radius: 10px; padding: 12px; margin-top: 10px; }
        .form-control { background: #1a1a1a; border: 1px solid #333; color: #fff; border-radius: 10px; padding: 10px 14px; }
        .form-control:focus { border-color: #f59e0b; background: #1a1a1a; color: #fff; box-shadow: 0 0 0 3px rgba(245,158,11,0.2); }
        .btn-reply { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; border: none; border-radius: 8px; padding: 8px 20px; font-weight: 600; font-size: 13px; transition: all 0.2s; }
        .btn-reply:hover { transform: translateY(-1px); color: #fff; }
        .btn-sm { border-radius: 8px; font-size: 13px; padding: 5px 14px; }
    </style>
</head>
<body>

<nav class="navbar">
    <a class="navbar-brand" href="/admin/dashboard">Admin Panel</a>
    <div>
        <a href="/admin/dashboard" class="btn btn-outline-warning btn-sm me-2">← Dashboard</a>
        <!-- GOOD - Thymeleaf adds the CSRF token automatically -->
        <form th:action="@{/logout}" method="post" class="d-inline ms-2">
            <button class="btn btn-outline-danger btn-sm">Logout</button>
        </form>
    </div>
</nav>

<div class="main">
    <h5 style="font-weight:700; margin-bottom:20px;">Student Feedbacks</h5>

    <div th:each="fb : ${feedbacks}" class="fb-card">
        <div class="d-flex justify-content-between align-items-start">
            <strong style="color:#a78bfa;" th:text="${fb.student.name}">Student Name</strong>
            <small style="color:#555;" th:text="${fb.createdAt}">Date</small>
        </div>
        <p th:text="${fb.message}" style="margin:10px 0 0; color:#ccc;">Feedback message...</p>

        <!-- If already replied, show the reply -->
        <div th:if="${fb.adminReply}" class="reply-box">
            <small style="color:#4ade80; font-weight:700;">Your Reply:</small>
            <p th:text="${fb.adminReply}" style="margin:4px 0 0; color:#ccc;">Reply text...</p>
            <small style="color:#555;" th:text="${fb.repliedAt}">Replied date</small>
        </div>

        <!-- If NOT replied, show the reply form -->
        <div th:unless="${fb.adminReply}" style="margin-top:12px;">
            <!-- NOTICE: th:action is used here for CSRF token! -->
            <form th:action="@{/admin/feedbacks/{id}/reply(id=${fb.id})}" method="post" class="d-flex gap-2">
                <input type="text" name="reply" class="form-control" placeholder="Type your reply..." required>
                <button type="submit" class="btn btn-reply">Reply</button>
            </form>
        </div>
    </div>

    <p th:if="${feedbacks == null or feedbacks.isEmpty()}" style="color:#444; text-align:center; margin-top:40px;">
        No feedbacks from students yet.
    </p>
</div>

</body>
</html>
