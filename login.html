<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #141414; border: 1px solid #222; border-radius: 20px; padding: 45px; max-width: 420px; width: 100%; }

        .form-control {
            background: #1a1a1a; border: 1px solid #333; color: #fff;
            border-radius: 10px; padding: 14px 16px; margin-bottom: 16px;
        }
        .form-control:focus {
            border-color: #6366f1; background: #1a1a1a; color: #fff;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
        }

        /* Dynamic Role Styles */
        .role-badge { display: inline-block; padding: 5px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 24px; letter-spacing: 1px; }
        .role-student { background: #6366f133; color: #a78bfa; }
        .role-admin { background: #f59e0b33; color: #fbbf24; }

        .btn-login {
            width: 100%; padding: 14px; border-radius: 10px; font-weight: 700;
            border: none; color: #fff; font-size: 16px; transition: all 0.2s;
        }
        .btn-student-login { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .btn-admin-login { background: linear-gradient(135deg, #f59e0b, #ef4444); }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.4); color: #fff; }

        .alert { border-radius: 10px; font-size: 14px; }
        a { color: #a78bfa; text-decoration: none; }
        a:hover { color: #c4b5fd; }
    </style>
</head>
<body>
<div class="login-card">
    <!-- Dynamic Badge -->
    <div th:if="${role == 'ADMIN'}" class="role-badge role-admin">ADMIN LOGIN</div>
    <div th:if="${role != 'ADMIN'}" class="role-badge role-student">STUDENT LOGIN</div>

    <!-- Error Message -->
    <div class="alert alert-danger" th:if="${errorMsg}" th:text="${errorMsg}"></div>

    <!-- Spring Security handles POST /login automatically -->
    <form th:action="@{/login}" method="post">
        <!-- 👇 YOU MUST ADD THIS HIDDEN INPUT! -->
        <input type="hidden" name="role" th:value="${role}">

        <input type="email" name="email" class="form-control" placeholder="Email address" required>
        <input type="password" name="password" class="form-control" placeholder="Password" required>
        <button type="submit" class="btn btn-login mt-2"
                th:classappend="${role == 'ADMIN'} ? 'btn-admin-login' : 'btn-student-login'">
            Login
        </button>
    </form>

    <p class="text-center mt-4" style="color:#888; font-size:15px;">
        Don't have an account?<br>
        <a th:if="${role == 'ADMIN'}" th:href="@{/admin/register}" class="fw-bold">Create an account</a>
        <a th:unless="${role == 'ADMIN'}" th:href="@{/student/register}" class="fw-bold">Create an account</a>
    </p>
    <p class="text-center mt-3">
        <a href="/landing" style="color:#555; font-size:13px;">← Back to role selection</a>
    </p>
</div>
</body>
</html>
