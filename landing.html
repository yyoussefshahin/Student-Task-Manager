<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, sans-serif;
        }
        .choice-card {
            background: #141414;
            border: 1px solid #222;
            border-radius: 20px;
            padding: 60px 50px;
            text-align: center;
            max-width: 550px;
            width: 100%;
        }
        h1 { font-weight: 800; margin-bottom: 8px; font-size: 2.2rem; }
        p.sub { color: #666; margin-bottom: 40px; font-size: 1.1rem; }

        .btn-student {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff; border: none; padding: 16px 40px;
            border-radius: 12px; font-size: 18px; font-weight: 700;
            margin: 10px; transition: all 0.3s; display: inline-block; text-decoration: none;
        }
        .btn-admin {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: #fff; border: none; padding: 16px 40px;
            border-radius: 12px; font-size: 18px; font-weight: 700;
            margin: 10px; transition: all 0.3s; display: inline-block; text-decoration: none;
        }
        .btn-student:hover, .btn-admin:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            color: #fff;
        }
    </style>
</head>
<body>
<div class="choice-card">
    <h1>Task Manager</h1>
    <p class="sub">Choose how you want to log in</p>

    <div>
        <a href="/student/login" class="btn-student">Student</a>
        <a href="/admin/login" class="btn-admin">Admin</a>
    </div>
</div>
</body>
</html>
